function formulaWeight(f){return f.entries.reduce((s,e)=>s+(+e.weight||0),0)}function pureWeight(e){return (+e.weight||0)*(+e.dilution||100)/100}function formulaPureWeight(f){return f.entries.filter(e=>!mat(e.materialId)?.solvent).reduce((s,e)=>s+pureWeight(e),0)}function entryCost(e){let m=mat(e.materialId);if(!m)return 0;let d=(m.dilutions||[]).find(x=>+x.pct===+(e.dilution||100));let carrier=mat(e.carrierId||d?.carrierId);let target=(+e.dilution||100),base=+(m.baseDilution||100);if(Math.abs(target-base)<1e-9)return (+e.weight||0)*(+m.cost||0);let pureCost=(+m.cost||0)*100/base;let blended=pureCost*target/100+(+carrier?.cost||0)*(1-target/100);return (+e.weight||0)*blended}function formulaCost(f){return f.entries.reduce((s,e)=>s+entryCost(e),0)}
function formulaStats(f){let total=formulaWeight(f),pure=formulaPureWeight(f),cost=formulaCost(f);return{total,pure,cost}}function formulaDisplayedTotalPct(f){if(pctMode===0){let total=formulaWeight(f),notes=f.entries.filter(e=>!mat(e.materialId)?.solvent).reduce((sum,e)=>sum+(+e.weight||0),0);return total?notes/total*100:0}return pctMode===1?(formulaPureWeight(f)>0?100:0):0}function ifraShare(f,e){let total=formulaWeight(f);return total?pureWeight(e)/total*100:0}function ifraExceeded(f,e){let m=mat(e.materialId);return !!m&&m.ifra!==''&&m.ifra!=null&&ifraShare(f,e)>Number(m.ifra)+1e-9}function formulaHasIFRAExceeded(f){return f.entries.some(e=>ifraExceeded(f,e))}
function renderFormulas(){let q=query.toLowerCase(),folders=db.folders.filter(x=>(x.parentId||null)===(currentFolderId||null)&&x.name.toLowerCase().includes(q)),fs=db.formulas.filter(f=>(f.folderId||null)===(currentFolderId||null)&&(f.name+' '+f.category+' '+f.notes+' '+f.entries.map(e=>mat(e.materialId)?.name||'').join(' ')).toLowerCase().includes(q));let html=toolbar(currentFolderId?'Rechercher dans ce dossier':'Rechercher une formule')+`<div class="row"><span class="tiny grow">${fs.length} formules · ${folders.length} dossiers</span><button class="btn" onclick="formulaLibraryTools()">•••</button></div>`;if(currentFolderId){let parent=folderStack.length?folderStack[folderStack.length-1]:null;html+=`<div class="row"><button class="back" onclick="goFormulaRoot()">‹ Bibliothèque des formules</button>${parent?`<button class="back" onclick="goParentFolder()">Retour au dossier précédent ›</button>`:''}</div>`}else html+=`<div class="sortline">${db.categories.map(c=>`<button class="btn" style="border-color:${esc(c.color)}" onclick="filterFamily('${esc(c.name)}')">${esc(c.name)}</button>`).join('')}</div>`;folders.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));fs.sort((a,b)=>(a.name||'').localeCompare(b.name||'',undefined,{numeric:true,sensitivity:'base'}));html+=folders.map(d=>`<div class="entry" onclick="openFolder('${d.id}')" ondragover="event.preventDefault()" ondrop="dropFormula(event,'${d.id}')" oncontextmenu="event.preventDefault();folderMenu('${d.id}')"><span class="name">📁 ${esc(d.name)}</span><span class="tiny">${db.formulas.filter(f=>f.folderId===d.id).length} formules</span></div>`).join('');html+=fs.length?fs.map(f=>{let st=formulaStats(f);return `<div class="entry" data-formula-id="${f.id}" draggable="true" ondragstart="dragFormula(event,'${f.id}')" onclick="if(!pressFired)openFormula('${f.id}');pressFired=false" oncontextmenu="event.preventDefault();formulaFamilyMenu('${f.id}')" ontouchstart="formulaTouchStart(event,'${f.id}')" ontouchend="formulaTouchEnd(event,'${f.id}')" ontouchmove="formulaTouchMove(event)"><span class="name" style="${formulaHasIFRAExceeded(f)?'color:var(--danger);font-weight:800':''}">${esc(f.name)}${db.manufactures.some(x=>x.formulaId===f.id&&!x.cancelledAt)?' <span title="Fabrication enregistrée" style="color:#8fbd70;font-weight:900;margin-left:6px">✓</span>':''}</span><span class="tiny">${esc(f.category||'Non classé')} · ${fmt(st.total)} g · ${eur(st.cost)}</span></div>`}).join(''):'<div class="empty">Aucune formule dans ce dossier.</div>';return html}
function openFolder(id){folderStack.push(currentFolderId);currentFolderId=id;query='';render()}
function goFormulaRoot(){currentFolderId=null;folderStack=[];query='';render()}
function goParentFolder(){currentFolderId=folderStack.pop()||null;query='';render()}
function createFolder(){let name=prompt('Nom du dossier :');if(!name?.trim())return;db.folders.push({id:uid(),name:name.trim(),parentId:currentFolderId||null});persist();render();closeModal()}
function folderMenu(id){let d=db.folders.find(x=>x.id===id);if(!d)return;modal(`<h3>Dossier · ${esc(d.name)}</h3><button class="menuitem" onclick="renameFolder('${id}')">Renommer</button><button class="menuitem danger" onclick="deleteFolder('${id}')">Supprimer le dossier</button>`)}
function renameFolder(id){let d=db.folders.find(x=>x.id===id),n=prompt('Nouveau nom :',d.name);if(n?.trim()){d.name=n.trim();persist();closeModal();render()}}
function deleteFolder(id){if(!confirm('Supprimer ce dossier ? Les formules et sous-dossiers seront déplacés vers son dossier parent.'))return;let d=db.folders.find(x=>x.id===id);db.formulas.forEach(f=>{if(f.folderId===id)f.folderId=d.parentId||null});db.folders.forEach(x=>{if(x.parentId===id)x.parentId=d.parentId||null});db.folders=db.folders.filter(x=>x.id!==id);persist();closeModal();render()}
function dragFormula(ev,id){ev.dataTransfer.setData('text/plain',id)}function dropFormula(ev,folderId){ev.preventDefault();let id=ev.dataTransfer.getData('text/plain'),f=formula(id);if(f){f.folderId=folderId;persist();render()}}
function formulaTouchStart(ev,id){let t=ev.touches?.[0];window._swipe={kind:'formula',id,x:t?.clientX||0,y:t?.clientY||0,dx:0,dy:0}}
function formulaTouchMove(ev){let sw=window._swipe,t=ev.touches?.[0];if(sw&&t){sw.dx=t.clientX-sw.x;sw.dy=t.clientY-sw.y}}
function formulaTouchEnd(ev,id){let sw=window._swipe;window._swipe=null;if(sw&&sw.kind==='formula'&&sw.id===id&&sw.dx<-70&&Math.abs(sw.dx)>Math.abs(sw.dy)*1.25){ev.preventDefault();pressFired=true;if(confirm('Supprimer cette formule ? Cette action ne peut pas être annulée.')){db.formulas=db.formulas.filter(f=>f.id!==id);persist();render()}}}
function materialTouchStart(ev,id){let t=ev.touches?.[0];window._swipe={kind:'material',id,x:t?.clientX||0,y:t?.clientY||0,dx:0,dy:0}}
function materialTouchMove(ev){let sw=window._swipe,t=ev.touches?.[0];if(sw&&t){sw.dx=t.clientX-sw.x;sw.dy=t.clientY-sw.y}}
function materialTouchEnd(ev,id){let sw=window._swipe;window._swipe=null;if(sw&&sw.kind==='material'&&sw.id===id&&sw.dx<-70&&Math.abs(sw.dx)>Math.abs(sw.dy)*1.25){ev.preventDefault();pressFired=true;let m=mat(id);if(!m)return;let uses=db.formulas.reduce((n,f)=>n+f.entries.filter(e=>e.materialId===id).length,0);if(confirm('Supprimer la matière « '+m.name+' » ? Elle est utilisée dans '+uses+' ligne(s) de formule. Les références existantes deviendront indisponibles.')){db.materials=db.materials.filter(x=>x.id!==id);persist();render()}}}

function filterFamily(c){query='';let fs=db.formulas.filter(f=>(f.category||'Non classé')===c);$('app').innerHTML=toolbar('Rechercher dans '+c)+`<div class="row"><button class="back" onclick="render()">‹ Toutes les formules</button><span class="grow"></span><b>${esc(c)}</b></div>`+(fs.length?fs.map(f=>`<div class="entry" onclick="openFormula('${f.id}')" oncontextmenu="event.preventDefault();formulaFamilyMenu('${f.id}')"><span class="name">${esc(f.name)}</span><span class="tiny">${fmt(formulaWeight(f))} g</span></div>`).join(''):'<div class="empty">Aucune formule dans cette famille.</div>');let s=$('search');s.oninput=()=>{query=s.value;render();filterFamily(c)}}
function renderMaterial(){let m=editM;let usages=db.formulas.flatMap(f=>f.entries.filter(e=>e.materialId===m.id).map(e=>({f,e})));$('app').innerHTML=`<div class="row"><button class="back grow" onclick="back()">‹ Bibliothèque des matières</button>${returnFormulaId?`<button class="back" onclick="returnToFormula()">Retour à la formule ›</button>`:""}</div><h1 class="title">${esc(m.name||'Nouvelle matière')}</h1><div class="tiny">${esc(m.cas||'Numéro CAS / nom botanique')}</div><section class="panel"><div class="grid">${field('Nom','name',m.name)}${field('CAS / nom botanique','cas',m.cas)}<div class="field"><label>Famille olfactive</label><select id="m_category">${db.categories.map(c=>`<option ${c.name===m.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Fournisseur</label><select id="m_supplier"><option value="">—</option>${db.suppliers.map(s=>`<option ${s===m.supplier?'selected':''}>${esc(s)}</option>`).join('')}</select></div>${field('Stock disponible','inventory',m.inventory,'number')}${field('Prix par gramme (€) · appui long pour calculer','cost',m.cost,'number')}<div class="field"><label>Limite IFRA (%)</label><div class="row"><input id="m_ifra" type="number" min="0" max="100" step="any" value="${esc(m.ifra)}" placeholder="Ex. 1"><span>%</span></div></div>${field('Date d’acquisition','date',m.date,'date')}<div class="field full"><label>Pyramide olfactive · étage de la matière</label><div class="picks">${['Top','High','Middle','Bottom','Base',''].map(p=>`<button type="button" data-p="${p}" aria-label="${p?({Top:'Tête',High:'Haut',Middle:'Cœur',Bottom:'Fond',Base:'Base'}[p]):'Non classée'}" title="${p?({Top:'Tête',High:'Haut',Middle:'Cœur',Bottom:'Fond',Base:'Base'}[p]):'Non classée'}" class="${(m.pyramid||'')===p?'sel':''}">${pyramidSvg(p,false)}</button>`).join('')}</div></div><div class="field full"><label>Description</label><textarea id="m_description" rows="4">${esc(m.description||'')}</textarea></div><div class="field full row"><label class="grow">Cette matière est-elle un solvant ?</label><input id="m_solvent" type="checkbox" style="width:auto" ${m.solvent?'checked':''}></div></div></section>
<section class="panel"><h2>Valeur du stock</h2><div class="statgrid"><div class="stat"><span class="tiny">Quantité</span><strong>${fmt(m.inventory)} g</strong></div><div class="stat"><span class="tiny">Prix / g</span><strong>${eur(m.cost)}</strong></div><div class="stat"><span class="tiny">Valeur du stock</span><strong>${eur((+m.inventory||0)*(+m.cost||0))}</strong></div></div><button class="btn" style="margin-top:10px" onclick="stockAdjustment()">Ajuster le stock</button></section>
<section class="panel"><h2>Dilutions enregistrées</h2><div id="dilutions">${(m.dilutions||[]).map((d,i)=>`<div class="dilrow"><input aria-label="Concentration" type="number" min=".001" max="100" step="any" value="${d.pct}" data-dpct="${i}"><input type="date" value="${esc(d.date||'')}" data-ddate="${i}"><input placeholder="Description" value="${esc(d.note||'')}" data-dnote="${i}" title="${esc(d.note||'')}"><select data-dcarrier="${i}"><option value="">Solvant non précisé</option>${db.materials.filter(x=>x.solvent).map(x=>`<option value="${x.id}" ${d.carrierId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="btn" title="Préparer cette dilution" onclick="prepareDilution(${i})">⚖</button><button class="danger" onclick="removeDilution(${i})">×</button></div><div class="tiny" style="margin:-3px 0 7px 3px">Stock de cette dilution : ${fmt(d.stock||0)} g · ${d.note?`<button class="back" style="padding:0" onclick="showDilutionDescription(${i})">Voir la description</button>`:''}</div>`).join('')}</div><button class="btn" onclick="addDilution()">＋ Ajouter une dilution</button></section>
<section class="panel"><h2>Utilisation dans les formules</h2>${usages.map(({f,e})=>{let share=formulaWeight(f)?e.weight/formulaWeight(f)*100:0;return `<div class="entry" onclick="openFormula('${f.id}')"><span class="name">${esc(f.name)} <span class="tiny">(${fmt(e.dilution||100)} %)</span></span><b>${fmt(share)} %</b></div>`}).join('')||'<span class="tiny">Cette matière n’est utilisée dans aucune formule.</span>'}</section><div class="tiny">Les modifications sont enregistrées automatiquement.</div><button class="btn danger" style="margin-top:12px" onclick="deleteMaterial()">Supprimer cette matière</button>`;
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{m.pyramid=b.dataset.p;document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('sel',x===b));persist()});let c=$('m_cost'),timer;if(c){c.addEventListener('pointerdown',()=>timer=setTimeout(costCalculator,550));['pointerup','pointerleave','pointercancel'].forEach(ev=>c.addEventListener(ev,()=>clearTimeout(timer)));c.addEventListener('contextmenu',e=>{e.preventDefault();costCalculator()})}wireMaterialAutosave()}
function field(label,key,val,type='text'){return `<div class="field"><label>${label}</label><input id="m_${key}" type="${type}" value="${esc(val??'')}" ${type==='number'?'step="any"':''}></div>`}
function wireMaterialAutosave(){let keys=['name','cas','category','supplier','inventory','cost','ifra','date','description','solvent'];keys.forEach(k=>{let el=$('m_'+k);if(!el)return;el.addEventListener('input',()=>{if(k==='inventory'||k==='cost')editM[k]=round3(Math.max(0,+el.value||0));else if(k==='solvent')editM.solvent=el.checked;else editM[k]=el.value;if(k==='ifra'&&el.value!=='')editM.ifra=round3(Math.min(100,Math.max(0,+el.value)));persist();if(k==='name')document.querySelector('.title').textContent=editM.name||'Nouvelle matière';});el.addEventListener('change',()=>{editM[k]=k==='solvent'?el.checked:(k==='inventory'||k==='cost'||k==='ifra'?round3(Math.max(0,+el.value||0)):el.value);if(k==='inventory')syncPureStock(editM);persist()})});document.querySelectorAll('[data-dpct],[data-ddate],[data-dnote],[data-dcarrier]').forEach(el=>el.addEventListener('input',saveDilutions));document.querySelectorAll('[data-dcarrier]').forEach(el=>el.addEventListener('change',saveDilutions))}
function saveDilutions(){(editM.dilutions||[]).forEach((d,i)=>{let p=document.querySelector(`[data-dpct="${i}"]`),dt=document.querySelector(`[data-ddate="${i}"]`),n=document.querySelector(`[data-dnote="${i}"]`),c=document.querySelector(`[data-dcarrier="${i}"]`);if(p&&p.value!=='')d.pct=round3(Math.min(100,Math.max(.01,+p.value)));if(dt)d.date=dt.value;if(n)d.note=n.value;if(c)d.carrierId=c.value});persist()}
function addDilution(){saveDilutions();editM.dilutions.push({id:uid(),pct:100,date:'',note:'',carrierId:'',stock:0});persist();renderMaterial()}function removeDilution(i){saveDilutions();editM.dilutions.splice(i,1);persist();renderMaterial()}
function showDilutionDescription(i){let d=editM.dilutions[i];modal(`<h3>Description · ${fmt(d.pct)} %</h3><p>${esc(d.note||'Aucune description.')}</p><div class="modalfoot"><button class="btn primary" onclick="closeModal()">Fermer</button></div>`)}
function prepareDilution(i){saveDilutions();let d=editM.dilutions[i];modal(`<h3>Préparer une dilution à ${fmt(d.pct)} %</h3><p class="info">La quantité finale est calculée à partir de la concentration de cette dilution. La préparation réserve les quantités dans le stock de dilution sans diminuer les stocks totaux. Les stocks totaux ne seront diminués qu’au moment de la fabrication d’une formule.</p><div class="field"><label>Quantité totale de solution souhaitée (g)</label><input id="prepTotal" type="number" step="any" placeholder="Ex. 10"></div><div class="panel" id="prepResult">Matière active : — g<br>Solvant à ajouter : — g</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="confirmPrepareDilution(${i})">Préparer et enregistrer</button></div>`);$('prepTotal').oninput=()=>{let total=+$('prepTotal').value,p=d.pct/100;$('prepResult').innerHTML=total>0?`Matière active : <b>${fmt(total*p)} g</b><br>Solvant à ajouter : <b>${fmt(total*(1-p))} g</b>`:'Matière active : — g<br>Solvant à ajouter : — g'}}
function confirmPrepareDilution(i){let d=editM.dilutions[i],total=+$('prepTotal').value,p=(+d.pct||0)/100,pure=round3(total*p),solv=round3(total-pure),carrier=mat(d.carrierId)||db.materials.find(x=>x.solvent);if(!(total>0&&p>0&&p<=1))return alert('Quantité ou concentration invalide.');if(Math.abs(p-1)<1e-9)return alert('La dilution à 100 % représente directement le stock pur disponible. Elle est synchronisée avec le stock global : ajoute ou ajuste la quantité dans « Stock disponible ».');let sourcePure=(editM.dilutions||[]).find(x=>Math.abs((+x.pct||0)-100)<1e-9);if(!sourcePure)return alert('Aucun stock source à 100 % n’est enregistré pour cette matière. Ajoute une dilution à 100 % avant de préparer une dilution inférieure.');syncPureStock(editM);if((+sourcePure.stock||0)+1e-9<pure)return alert(`Stock insuffisant dans la dilution à 100 % : ${fmt(sourcePure.stock||0)} g disponibles, ${fmt(pure)} g nécessaires.`);let sourceCarrier=carrier?.dilutions?.find(x=>Math.abs((+x.pct||0)-100)<1e-9);if(solv>0){if(!carrier)return alert('Solvant non défini pour cette dilution.');syncPureStock(carrier);if(!sourceCarrier||(+sourceCarrier.stock||0)+1e-9<solv)return alert(`Stock insuffisant de solvant à 100 % : ${fmt(sourceCarrier?.stock||0)} g disponibles, ${fmt(solv)} g nécessaires.`)}sourcePure.stock=round3((+sourcePure.stock||0)-pure);if(sourceCarrier&&solv>0)sourceCarrier.stock=round3((+sourceCarrier.stock||0)-solv);if(carrier&&solv>0)d.carrierId=carrier.id;d.stock=round3((+d.stock||0)+total);d.date=new Date().toISOString().slice(0,10);syncPureStock(editM);if(carrier)syncPureStock(carrier);persist();closeModal();renderMaterial();alert(`Dilution préparée : ${fmt(pure)} g prélevés dans la dilution à 100 % + ${fmt(solv)} g de solvant prélevés dans le stock à 100 % = ${fmt(total)} g. Le stock global reste inchangé.`)}
function costCalculator(){modal(`<h3>Calculer le coût total de la ligne</h3><p class="info">Renseigne toi-même le prix payé et la quantité achetée. Le résultat sera enregistré dans la fiche.</p><div class="grid"><div class="field"><label>Quantité achetée (g)</label><input id="calcQ" type="number" min=".001" step="any" placeholder="Quantité en g"></div><div class="field"><label>Prix payé (€)</label><input id="calcP" type="number" min="0" step="any" placeholder="Prix en €"></div></div><h2 id="calcR" style="margin:15px 0">— €/g</h2><div class="modalfoot"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="applyCost()">Enregistrer le prix / g</button></div>`);let upd=()=>{let q=+$('calcQ').value,p=+$('calcP').value;$('calcR').textContent=$('calcQ').value!==''&&$('calcP').value!==''&&q>0?eur(p/q)+'/g':'— €/g'};$('calcQ').oninput=upd;$('calcP').oninput=upd}
function applyCost(){let q=+$('calcQ').value,p=+$('calcP').value;if(!$('calcQ').value||!$('calcP').value||q<=0||p<0)return alert('Renseigne une quantité positive et un prix valide.');editM.cost=Math.round((p/q)*100)/100;$('m_cost').value=editM.cost.toFixed(5);persist();closeModal();renderMaterial()}
function stockAdjustment(){modal(`<h3>Ajuster le stock · ${esc(editM.name)}</h3><label class="tiny">Variation en grammes (+ ou −)</label><input id="stockDelta" type="number" step="any" placeholder="Ex. 5 ou -2"><label class="tiny">Motif</label><input id="stockReason" placeholder="Motif de l’ajustement"><div class="modalfoot"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="applyStock()">Valider</button></div>`)}function applyStock(){let d=+$('stockDelta').value;if(editM.inventory+d<0)return alert('Stock insuffisant.');editM.inventory=round3(editM.inventory+d);syncPureStock(editM);db.stockLog.push({date:new Date().toISOString(),materialId:editM.id,delta:d,reason:$('stockReason').value});persist();closeModal();renderMaterial()}
function deleteMaterial(){if(db.formulas.some(f=>f.entries.some(e=>e.materialId===editM.id)))return alert('Cette matière est utilisée dans une formule. Remplace-la dans les formules avant de la supprimer.');if(confirm('Supprimer cette matière première ?')){db.materials=db.materials.filter(m=>m.id!==editM.id);persist();back()}}
function openMaterial(id){if(page==='formula'&&editF)returnFormulaId=editF.id;editM=mat(id);page='material';renderMaterial()}function returnToFormula(){let f=formula(returnFormulaId);if(f){editF=f;editM=null;page='formula';returnFormulaId=null;renderFormula()}else back()}function back(){page='list';editM=editF=null;returnFormulaId=null;persist();render()}

function formulaSortMenu(){modal(`<h3>Trier les notes</h3><p class="info">Le tri change uniquement l’ordre d’affichage des lignes.</p>${['Nom A → Z','Nom Z → A','Poids décroissant','Prix décroissant','Pourcentage décroissant','Dilution croissante','Famille olfactive','Pyramide olfactive'].map(s=>`<button class="menuitem" onclick="sortEntries('${s}')">${s}</button>`).join('')}`)}function sortEntries(s){let f=editF;let fn={'Nom A → Z':(a,b)=>(mat(a.materialId)?.name||'').localeCompare(mat(b.materialId)?.name||''),'Nom Z → A':(a,b)=>(mat(b.materialId)?.name||'').localeCompare(mat(a.materialId)?.name||''),'Poids décroissant':(a,b)=>b.weight-a.weight,'Prix décroissant':(a,b)=>entryCost(b)-entryCost(a),'Pourcentage décroissant':(a,b)=>pureWeight(b)-pureWeight(a),'Famille olfactive':(a,b)=>(mat(a.materialId)?.category||'').localeCompare(mat(b.materialId)?.category||''),'Dilution croissante':(a,b)=>a.dilution-b.dilution,'Pyramide olfactive':(a,b)=>['Top','High','Middle','Bottom','Base'].indexOf(mat(a.materialId)?.pyramid)-['Top','High','Middle','Bottom','Base'].indexOf(mat(b.materialId)?.pyramid)}[s];f.entries.sort(fn);persist();closeModal();renderFormula()}
function formulaLibraryTools(){modal(`<h3>Bibliothèque des formules</h3><button class="menuitem" onclick="createFolder()">Créer un dossier</button><button class="menuitem" onclick="randomFormulaFromLibrary()">Créer une formule aléatoire</button><button class="menuitem" onclick="categoryManager('formulas')">Gérer les familles</button><button class="menuitem" onclick="exportFormulaLibrary()">Exporter la bibliothèque</button><button class="menuitem" onclick="backupExport()">Sauvegarder toutes les données</button><button class="menuitem" onclick="printLibrary()">Exporter en PDF / imprimer</button>`)}function randomFormulaFromLibrary(){editF={id:uid(),name:'Formule aléatoire',date:new Date().toISOString().slice(0,10),category:'Non classé',notes:'',entries:[],folderId:currentFolderId||null};db.formulas.push(editF);randomFormula()}
function categoryManager(kind='materials'){modal(`<h3>Familles et catégories</h3>${db.categories.map((c,i)=>`<div class="row" style="margin:7px 0"><input id="cn${i}" value="${esc(c.name)}"><input id="cc${i}" type="color" value="${c.color}" style="width:48px;padding:3px"><button class="danger" onclick="removeCategory(${i},'${kind}')">×</button></div>`).join('')}<button class="btn" onclick="addCategory('${kind}')">＋ Ajouter une famille</button><div class="modalfoot"><button class="btn primary" onclick="saveCategories()">Enregistrer</button></div>`)}function addCategory(kind){db.categories.push({id:uid(),name:'Nouvelle famille',color:'#777777',order:db.categories.length});categoryManager(kind)}function removeCategory(i,kind){let c=db.categories.splice(i,1)[0];db.materials.forEach(m=>{if(m.category===c.name)m.category='Non classé'});db.formulas.forEach(f=>{if(f.category===c.name)f.category='Non classé'});categoryManager(kind)}function saveCategories(){db.categories.forEach((c,i)=>{let old=c.name,n=$('cn'+i)?.value.trim();if(n){c.name=n;c.color=$('cc'+i).value;c.order=i;db.materials.forEach(m=>{if(m.category===old)m.category=n});db.formulas.forEach(f=>{if(f.category===old)f.category=n})}});persist();closeModal();render()}
function settingsMenu(){modal(`<h3>Paramètres et sauvegarde</h3><div class="field"><label>Dilution par défaut (%)</label><input id="defaultDilution" type="number" min=".001" max="100" step="any" value="${db.settings.defaultDilution}"></div><div class="row" style="margin:10px 0"><label class="grow">Rechercher aussi dans les descriptions</label><input id="searchDesc" type="checkbox" style="width:auto" ${db.settings.searchDescriptions?'checked':''}></div><button class="menuitem" onclick="categoryManager()">Gérer les familles olfactives</button><button class="menuitem" onclick="manageSuppliers()">Gérer les fournisseurs</button><button class="menuitem" onclick="backupExport()">Exporter une sauvegarde JSON</button><label class="menuitem">Importer / restaurer une sauvegarde JSON<input type="file" accept=".json,application/json" onchange="backupImport(event)"></label><button class="menuitem" onclick="exportMaterials()">Exporter les matières en CSV</button><button class="menuitem" onclick="exportMaterialsPDF()">Exporter les matières en PDF</button><button class="menuitem" onclick="runTests()">Tester les calculs</button><div class="modalfoot"><button class="btn primary" onclick="saveSettings()">Enregistrer</button></div>`)}function saveSettings(){db.settings.defaultDilution=round3(Math.min(100,Math.max(.01,+$('defaultDilution').value||100)));db.settings.searchDescriptions=$('searchDesc').checked;persist();closeModal()}
function manageSuppliers(){modal(`<h3>Fournisseurs</h3>${db.suppliers.map((s,i)=>`<div class="row"><span class="grow">${esc(s)}</span><button class="danger" onclick="db.suppliers.splice(${i},1);persist();manageSuppliers()">×</button></div>`).join('')}<div class="row" style="margin-top:10px"><input id="supplierNew" placeholder="Nom du fournisseur"><button class="btn primary" onclick="let s=$('supplierNew').value.trim();if(s&&!db.suppliers.includes(s))db.suppliers.push(s);persist();manageSuppliers()">Ajouter</button></div>`)}
function manufacture(){if(!formulaWeight(editF))return alert('La formule est vide.');modal(`<h3>Enregistrer une fabrication</h3><p class="info">Les dilutions déjà préparées sont utilisées en priorité. Le complément est calculé en matière pure et en solvant. Aucun stock ne sera modifié avant confirmation.</p><div class="field"><label>Multiplicateur de lot</label><input id="batch" type="number" min=".001" step="any" placeholder="Ex. 1"></div><div class="panel" id="batchPreview">Indique un multiplicateur pour voir les quantités à peser.</div><div class="field"><label>Date</label><input id="batchDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Notes</label><input id="batchNote" placeholder="Facultatif"></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="confirmManufacture()">Confirmer la fabrication</button></div>`);$('batch').oninput=updateManufacturePreview}
function calculateManufactureNeeds(mult){let need={},dilutionRemaining=new Map(),dilutionRefs=new Map(),lines=[],error='';for(let e of editF.entries){let m=mat(e.materialId);if(!m)continue;let required=(+e.weight||0)*mult;if(m.solvent){need[m.id]=(need[m.id]||0)+required;lines.push({name:m.name,detail:'Solvant ajouté directement',amount:required});continue}let d=(m.dilutions||[]).find(x=>+x.pct===+(e.dilution||100)),carrier=mat(e.carrierId||d?.carrierId)||db.materials.find(x=>x.solvent),pct=(+e.dilution||100)/100,available=d?(dilutionRemaining.has(d.id)?dilutionRemaining.get(d.id):(+d.stock||0)):0,fromPrepared=Math.min(available,required),remainder=required-fromPrepared;if(d&&fromPrepared>0){dilutionRemaining.set(d.id,available-fromPrepared);dilutionRefs.set(d.id,d);let preparedPure=fromPrepared*pct,preparedSolv=fromPrepared-preparedPure;if(preparedPure>0)need[m.id]=(need[m.id]||0)+preparedPure;if(preparedSolv>0){if(carrier)need[carrier.id]=(need[carrier.id]||0)+preparedSolv;else error='Solvant non défini pour la dilution de '+m.name+'.'}}let pure=remainder*pct,solv=remainder-pure;if(fromPrepared>0)lines.push({name:m.name+' · dilution '+fmt(d.pct)+' %',detail:'Stock de dilution utilisé (déduction de la matière active et du solvant au moment de la fabrication)',amount:fromPrepared});if(pure>0)need[m.id]=(need[m.id]||0)+pure;if(solv>0){if(carrier)need[carrier.id]=(need[carrier.id]||0)+solv;else error='Solvant non défini pour '+m.name+'.'}if(pure>0||solv>0)lines.push({name:m.name,detail:'Complément à préparer : matière pure '+fmt(pure)+' g'+(carrier?' + solvant '+fmt(solv)+' g':''),amount:remainder})}let reservedAfter={};for(let owner of db.materials){for(let dilution of owner.dilutions||[]){let remaining=dilutionRemaining.has(dilution.id)?dilutionRemaining.get(dilution.id):(+dilution.stock||0);if(remaining<=0)continue;let pct=(+dilution.pct||0)/100,carrierId=dilution.carrierId||db.materials.find(x=>x.solvent)?.id;if(owner.solvent)continue;reservedAfter[owner.id]=(reservedAfter[owner.id]||0)+remaining*pct;if(carrierId&&remaining*(1-pct)>0)reservedAfter[carrierId]=(reservedAfter[carrierId]||0)+remaining*(1-pct)}}let shortages=Object.entries(need).filter(([id,w])=>(+mat(id)?.inventory||0)-w+1e-9<(reservedAfter[id]||0));return{need,dilutionRemaining,dilutionRefs,lines,error,shortages,reservedAfter}}
function updateManufacturePreview(){let el=$('batchPreview'),mult=+$('batch').value;if(!el)return;if(!(mult>0)){el.textContent='Indique un multiplicateur pour voir les quantités à peser.';return}let c=calculateManufactureNeeds(mult),html=`<b>Quantités nécessaires · lot × ${fmt(mult)}</b><br>`+c.lines.map(x=>`${esc(x.name)} : ${fmt(x.amount)} g <span class="tiny">(${esc(x.detail)})</span>`).join('<br>')+`<hr><b>À prélever dans les stocks :</b><br>`+Object.entries(c.need).map(([id,w])=>{let m=mat(id),stock=+m?.inventory||0,reserved=c.reservedAfter[id]||0,free=stock-reserved;return `${esc(m?.name||'Matière')} : ${fmt(w)} g nécessaires · ${fmt(free)} g disponibles hors réservations (${fmt(reserved)} g réservés) · ${free+1e-9>=w?'OK':'MANQUE '+fmt(w-free)+' g'}`}).join('<br>');if(c.error)html+=`<br><span class="danger">${esc(c.error)}</span>`;if(c.shortages.length)html+=`<br><span class="danger">Stock insuffisant pour terminer la fabrication.</span>`;el.innerHTML=html}
function confirmManufacture(){let mult=+$('batch').value;if(!(mult>0))return alert('Multiplicateur invalide.');let c=calculateManufactureNeeds(mult);if(c.error)return alert(c.error);if(c.shortages.length)return alert('Stock insuffisant ou quantité déjà réservée dans une autre dilution : '+c.shortages.map(([id])=>mat(id)?.name).join(', '));let dilutionChanges=[];c.dilutionRemaining.forEach((remaining,id)=>{let d=c.dilutionRefs.get(id),used=round3((+d.stock||0)-remaining);if(used>0){d.stock=round3(remaining);dilutionChanges.push({dilutionId:id,materialId:matForDilution(id)?.id||null,amount:used})}});let stockChanges=[];Object.entries(c.need).forEach(([id,w])=>{let m=mat(id);m.inventory=round3((+m.inventory||0)-w);stockChanges.push({materialId:id,amount:round3(w)});db.stockLog.push({date:$('batchDate').value,materialId:id,delta:-w,reason:'Fabrication '+editF.name})});let cost=formulaCost(editF)*mult,record={id:uid(),formulaId:editF.id,date:$('batchDate').value,multiplier:mult,weight:formulaWeight(editF)*mult,cost,notes:$('batchNote').value,stockChanges,dilutionChanges,cancelledAt:null};db.manufactures.push(record);db.materials.forEach(syncPureStock);persist();closeModal();alert('Fabrication enregistrée. Stocks mis à jour.');renderFormula()}
function matForDilution(id){return db.materials.find(m=>(m.dilutions||[]).some(d=>d.id===id))||null}
function cancelManufacture(id){let record=db.manufactures.find(x=>x.id===id);if(!record||record.cancelledAt)return;if(!Array.isArray(record.stockChanges)||!Array.isArray(record.dilutionChanges))return alert('Cette ancienne fabrication ne contient pas le détail des prélèvements. Annulation automatique impossible sans risquer de fausser les stocks.');if(!confirm('Annuler cette fabrication ? Les stocks consommés seront restitués et la coche verte sera retirée si aucune autre fabrication active ne reste.'))return;for(let change of record.stockChanges||[]){let m=mat(change.materialId);if(m){m.inventory=round3((+m.inventory||0)+(+change.amount||0));db.stockLog.push({date:new Date().toISOString().slice(0,10),materialId:m.id,delta:+change.amount||0,reason:'Annulation fabrication '+(formula(record.formulaId)?.name||'formule')})}}for(let change of record.dilutionChanges||[]){let owner=matForDilution(change.dilutionId),d=owner?.dilutions?.find(x=>x.id===change.dilutionId);if(d)d.stock=round3((+d.stock||0)+(+change.amount||0))}record.cancelledAt=new Date().toISOString();db.materials.forEach(syncPureStock);persist();closeModal();if(page==='formula'&&editF)renderFormula();else render()}

function backupExport(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'olfactory-sauvegarde.json')}function backupImport(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(!o.materials||!o.formulas||!o.categories)throw Error();db=o;persist();closeModal();render();alert('Sauvegarde restaurée.')}catch(err){alert('Fichier de sauvegarde invalide.')}};r.readAsText(file)}function exportMaterials(){let rows=[['Matière','Catégorie','Pyramide','Stock_g','Prix_par_g_EUR','Limite_IFRA_pct'],...db.materials.map(m=>[m.name,m.category,m.pyramid,m.inventory,m.cost,m.ifra])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'olfactory-matieres.csv')}function exportFormulaLibrary(){download(new Blob([JSON.stringify(db.formulas,null,2)],{type:'application/json'}),'olfactory-formules.json')}function exportFormula(){modal(`<h3>Exporter « ${esc(editF.name)} »</h3><button class="menuitem" onclick="exportFormulaAs('json')">JSON · données complètes</button><button class="menuitem" onclick="exportFormulaAs('tsv')">TSV · tableau</button><button class="menuitem" onclick="exportFormulaAs('pdf')">PDF · impression</button>`)}
function exportFormulaAs(kind){let f=editF,base=(f.name||'formule').replace(/[^a-z0-9-_]/gi,'_');closeModal();if(kind==='json')download(new Blob([JSON.stringify(f,null,2)],{type:'application/json'}),base+'.json');else if(kind==='tsv'){let rows=[['Matière','Poids_g','Dilution_pct','Matière_active_g','Pourcentage_formule','Coût_EUR'],...f.entries.map(e=>[mat(e.materialId)?.name||'',e.weight,e.dilution,pureWeight(e),formulaWeight(f)?pureWeight(e)/formulaWeight(f)*100:0,entryCost(e)])];download(new Blob(['\\ufeff'+rows.map(r=>r.join('\\t')).join('\\r\\n')],{type:'text/tab-separated-values;charset=utf-8'}),base+'.tsv')}else printDoc('Olfactory · '+f.name,`<table><tr><th>Matière</th><th>Poids</th><th>Dilution</th><th>Actif</th></tr>${f.entries.map(e=>`<tr><td>${esc(mat(e.materialId)?.name||'')}</td><td>${fmt(e.weight)} g</td><td>${fmt(e.dilution)} %</td><td>${fmt(pureWeight(e))} g</td></tr>`).join('')}</table><p>Total : ${fmt(formulaWeight(f))} g · Coût : ${eur(formulaCost(f))}</p>`)}function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function printDoc(title,body){let w=window.open('','_blank');if(!w)return alert('Autorise les fenêtres pop-up pour exporter en PDF.');w.document.write(`<html><head><title>${esc(title)}</title><style>body{font:12px Arial;padding:25px;color:#111}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:6px;text-align:left}
/* Correctifs iPhone : pas de sélection bleue ni de zoom automatique */
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:pan-y}
button,.entry,.matname,.pyrsvg,.pyr,.tab,.icon,.btn,.bottom{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none} .entry{touch-action:pan-y} .bottom button{height:46px;min-width:64px;align-content:center}
input,textarea,select{font-size:16px!important; -webkit-user-select:text;user-select:text;touch-action:manipulation}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
</style></head><body><h1>${esc(title)}</h1>${body}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}function exportMaterialsPDF(){printDoc('Olfactory · Matières premières',`<table><tr><th>Matière</th><th>Famille</th><th>Étage</th><th>Stock</th><th>Prix/g</th></tr>${db.materials.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.category)}</td><td>${esc(m.pyramid)}</td><td>${fmt(m.inventory)} g</td><td>${eur(m.cost)}</td></tr>`).join('')}</table>`)}function printLibrary(){printDoc('Olfactory · Bibliothèque des formules',`<table><tr><th>Formule</th><th>Famille</th><th>Poids</th><th>Coût</th></tr>${db.formulas.map(f=>`<tr><td>${esc(f.name)}</td><td>${esc(f.category)}</td><td>${fmt(formulaWeight(f))} g</td><td>${eur(formulaCost(f))}</td></tr>`).join('')}</table>`)}
function selfTest(){let t=[];const eq=(n,a,b)=>t.push({n,ok:Math.abs(a-b)<1e-8});eq('34 matières premières dans le stock initial',SEED.length,34);eq('35 références avec alcool',SEED.length+1,35);eq('Prix au gramme',6/10,.6);eq('Dilution 10 % sur 10 g',10*.1,1);eq('Solvant pour 10 g à 10 %',10*.9,9);eq('Mise à l’échelle 5 vers 10 g',5*10/5,10);eq('Pourcentage d’une note',1/10*100,10);eq('Prix arrondi au centime',Math.round(1.234*100)/100,1.23);eq('Matière active consommée à 10 %',1*.1,.1);eq('Solvant consommé à 10 %',1*.9,.9);let testPure=10,testDil10=0,testDil20=0;testPure-=2*.1;testDil10+=2;eq('Transfert 2 g à 10 % : source pure restante',testPure,9.8);eq('Transfert 2 g à 10 % : dilution créée',testDil10,2);testPure-=2*.2;testDil20+=2;eq('Transfert 2 g à 20 % : source pure restante',testPure,9.4);eq('Transfert 2 g à 20 % : dilution créée',testDil20,2);eq('Stock global inchangé pendant les transferts',10,10);eq('Arrondi au centième',round3(0.176),.18);return t}function runTests(){let t=selfTest();modal(`<h3>Vérification des calculs</h3>${t.map(x=>`<div class="row" style="padding:8px 0"><span class="grow">${esc(x.n)}</span><b style="color:${x.ok?'#9fbd78':'#ff5b45'}">${x.ok?'RÉUSSI':'ÉCHEC'}</b></div>`).join('')}<p class="tiny">${t.filter(x=>x.ok).length}/${t.length} tests mathématiques réussis. Cela ne remplace pas les tests sur iPhone et navigateur.</p>`)}function closeModal(){$('modalbg').classList.remove('show');document.body.classList.remove('modal-open')}function modal(html){$('modal').innerHTML=html;$('modalbg').classList.add('show');document.body.classList.add('modal-open');requestAnimationFrame(updateViewportMetrics)}function startLong(e,fn){pressFired=false;pressTimer=setTimeout(()=>{pressFired=true;fn()},550)}function endLong(){clearTimeout(pressTimer)}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
// Autosave de secours avant fermeture / changement d’onglet.
window.addEventListener('pagehide',persist);document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});
/* iPhone : la fenêtre suit la zone réellement visible quand le clavier apparaît. */
function updateViewportMetrics(){const vv=window.visualViewport;if(!vv)return;document.documentElement.style.setProperty('--vv-height',vv.height+'px');document.documentElement.style.setProperty('--vv-top',vv.offsetTop+'px')}
(function(){let pending=0;function keepFocusedFieldVisible(){let el=document.activeElement;if(!el||!el.matches('input,textarea,select'))return;cancelAnimationFrame(pending);pending=requestAnimationFrame(()=>{updateViewportMetrics();let modalEl=document.getElementById('modal'),r=el.getBoundingClientRect();if(modalEl&&document.body.classList.contains('modal-open')){let mr=modalEl.getBoundingClientRect(),pad=18;if(r.bottom>mr.bottom-pad)modalEl.scrollTop+=r.bottom-(mr.bottom-pad);else if(r.top<mr.top+pad)modalEl.scrollTop-=mr.top+pad-r.top}else if(r.bottom>(window.visualViewport?.height||window.innerHeight)-18){window.scrollBy(0,r.bottom-(window.visualViewport?.height||window.innerHeight)+24)}})}document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))setTimeout(keepFocusedFieldVisible,280)});if(window.visualViewport){window.visualViewport.addEventListener('resize',keepFocusedFieldVisible);window.visualViewport.addEventListener('scroll',updateViewportMetrics)}updateViewportMetrics()})();

document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});let lastTouchEnd=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=280&&e.target.closest('button,.tab,.entry,.bottom'))e.preventDefault();lastTouchEnd=now},{passive:false});
render();

/* Toutes les actions de clic droit sont aussi accessibles par appui long tactile. */
(function(){
 let timer=null,target=null,startX=0,startY=0,fired=false;
 document.addEventListener('touchstart',function(e){
  const el=e.target.closest('[oncontextmenu]');
  if(!el)return;
  target=el;fired=false;startX=e.touches[0].clientX;startY=e.touches[0].clientY;
  timer=setTimeout(function(){
   if(!target)return;fired=true;pressFired=true;
   const ev=new Event('contextmenu',{bubbles:true,cancelable:true});
   target.dispatchEvent(ev);
  },560);
 },{passive:true});
 function cancel(){clearTimeout(timer);timer=null;target=null}
 document.addEventListener('touchmove',function(e){
  if(!timer)return;const t=e.touches[0];
  if(Math.abs(t.clientX-startX)>12||Math.abs(t.clientY-startY)>12)cancel();
 },{passive:true});
 document.addEventListener('touchend',cancel,{passive:true});
 document.addEventListener('touchcancel',cancel,{passive:true});
 document.addEventListener('contextmenu',e=>{if(e.target.closest('[oncontextmenu]'))e.preventDefault()});
})();

/* Navigation horizontale entre les deux bibliothèques : gauche = formules, droite = matières.
   Les gestes dans les champs, modales et lignes de contenu sont réservés à leurs propres actions. */
(function(){let start=null;const app=document.getElementById('app');if(!app)return;app.addEventListener('touchstart',e=>{if(page!=='list'||document.getElementById('modalbg')?.classList.contains('show'))return;let t=e.target;if(t.closest('input,textarea,select,button,.entry,[data-row],.panel'))return;let p=e.touches[0];start={x:p.clientX,y:p.clientY}}, {passive:true});app.addEventListener('touchend',e=>{if(!start)return;let p=e.changedTouches[0],dx=p.clientX-start.x,dy=p.clientY-start.y;start=null;if(Math.abs(dx)<85||Math.abs(dx)<Math.abs(dy)*1.35)return;if(dx<0&&tab!=='formulas')goTab('formulas');else if(dx>0&&tab!=='materials')goTab('materials')},{passive:true});app.addEventListener('touchcancel',()=>start=null,{passive:true})})();
